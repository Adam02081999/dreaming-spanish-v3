ablan distinto a nosotros.", "en": "Here they speak differently from us.", "note": "", "sec": "Viajar y mostrar una ciudad"}, {"id": 287, "es": "Se nota el acento enseguida.", "en": "You notice the accent right away.", "note": "notarse = to be noticeable", "sec": "Viajar y mostrar una ciudad"}, {"id": 288, "es": "Vinimos caminando desde el hotel.", "en": "We walked here from the hotel.", "note": "", "sec": "Viajar y mostrar una ciudad"}, {"id": 289, "es": "Esto que ven es el centro histórico.", "en": "What you're seeing is the historic centre.", "note": "", "sec": "Viajar y mostrar una ciudad"}, {"id": 290, "es": "Hay muchísima gente un domingo.", "en": "There are loads of people on a Sunday.", "note": "", "sec": "Viajar y mostrar una ciudad"}, {"id": 291, "es": "Vamos a entrar a ver cómo es por dentro.", "en": "Let's go in and see what it's like inside.", "note": "", "sec": "Viajar y mostrar una ciudad"}, {"id": 292, "es": "Me dijeron que acá se come bárbaro.", "en": "They told me the food's great here.", "note": "", "sec": "Viajar y mostrar una ciudad"}, {"id": 293, "es": "Quiero probar lo típico de acá.", "en": "I want to try the typical food from here.", "note": "", "sec": "Viajar y mostrar una ciudad"}, {"id": 294, "es": "Mañana vamos a otro lado.", "en": "Tomorrow we're going somewhere else.", "note": "", "sec": "Viajar y mostrar una ciudad"}, {"id": 295, "es": "Nos queda poquito tiempo.", "en": "We have very little time left.", "note": "", "sec": "Viajar y mostrar una ciudad"}, {"id": 296, "es": "Me voy con ganas de volver.", "en": "I'm leaving wanting to come back.", "note": "", "sec": "Viajar y mostrar una ciudad"}, {"id": 297, "es": "Fue mucho mejor de lo que esperaba.", "en": "It was much better than I expected.", "note": "", "sec": "Viajar y mostrar una ciudad"}, {"id": 298, "es": "Si pueden venir, vengan.", "en": "If you can come, come.", "note": "", "sec": "Viajar y mostrar una ciudad"}, {"id": 299, "es": "Después les muestro las fotos.", "en": "I'll show you the photos later.", "note": "", "sec": "Viajar y mostrar una ciudad"}, {"id": 300, "es": "Ya les voy a contar más.", "en": "I'll tell you more soon.", "note": "", "sec": "Viajar y mostrar una ciudad"}, {"id": 301, "es": "Hoy vino mi hermana a visitarme.", "en": "Today my sister came to visit me.", "note": "", "sec": "Familia y amigos"}, {"id": 302, "es": "Nos vemos bastante seguido.", "en": "We see each other fairly often.", "note": "", "sec": "Familia y amigos"}, {"id": 303, "es": "Mis viejos viven a dos horas de acá.", "en": "My parents live two hours from here.", "note": "los viejos = parents, affectionate RP", "sec": "Familia y amigos"}, {"id": 304, "es": "Nos juntamos todos los domingos a comer.", "en": "We get together every Sunday to eat.", "note": "", "sec": "Familia y amigos"}, {"id": 305, "es": "Somos muchos en mi familia.", "en": "There are a lot of us in my family.", "note": "", "sec": "Familia y amigos"}, {"id": 306, "es": "Nos llevamos muy bien.", "en": "We get on really well.", "note": "", "sec": "Familia y amigos"}, {"id": 307, "es": "Ella es mi amiga de toda la vida.", "en": "She's my lifelong friend.", "note": "", "sec": "Familia y amigos"}, {"id": 308, "es": "Nos conocemos desde la escuela.", "en": "We've known each other since school.", "note": "", "sec": "Familia y amigos"}, {"id": 309, "es": "Siempre que puedo los visito.", "en": "Whenever I can I visit them.", "note": "", "sec": "Familia y amigos"}, {"id": 310, "es": "Extraño mucho a mi familia cuando viajo.", "en": "I really miss my family when I travel.", "note": "", "sec": "Familia y amigos"}, {"id": 311, "es": "Hablamos por videollamada una vez por semana.", "en": "We talk by video call once a week.", "note": "", "sec": "Familia y amigos"}, {"id": 312, "es": "Mi abuela cocinaba espectacular.", "en": "My grandmother cooked spectacularly.", "note": "", "sec": "Familia y amigos"}, {"id": 313, "es": "De ella aprendí casi todo lo que sé.", "en": "From her I learned almost everything I know.", "note": "", "sec": "Familia y amigos"}, {"id": 314, "es": "Es la persona más buena que conozco.", "en": "She's the kindest person I know.", "note": "", "sec": "Familia y amigos"}, {"id": 315, "es": "Siempre me banca en todo.", "en": "He always has my back in everything.", "note": "bancar = to back someone up", "sec": "Familia y amigos"}, {"id": 316, "es": "Nos reímos muchísimo cuando estamos juntos.", "en": "We laugh so much when we're together.", "note": "", "sec": "Familia y amigos"}, {"id": 317, "es": "Hace rato que no los veo.", "en": "I haven't seen them in a while.", "note": "", "sec": "Familia y amigos"}, {"id": 318, "es": "Este fin de semana los voy a ver.", "en": "This weekend I'm going to see them.", "note": "", "sec": "Familia y amigos"}, {"id": 319, "es": "Para mí la familia es todo.", "en": "For me family is everything.", "note": "", "sec": "Familia y amigos"}, {"id": 320, "es": "Ellos saben que cuentan conmigo.", "en": "They know they can count on me.", "note": "", "sec": "Familia y amigos"}, {"id": 321, "es": "Varios me preguntaron lo mismo, así que respondo.", "en": "Several of you asked the same thing, so I'll answer.", "note": "", "sec": "Responder preguntas de ustedes"}, {"id": 322, "es": "Me preguntan cuánto tardé en aprender.", "en": "You ask how long it took me to learn.", "note": "", "sec": "Responder preguntas de ustedes"}, {"id": 323, "es": "La verdad es que no hay una respuesta única.", "en": "The truth is there's no single answer.", "note": "", "sec": "Responder preguntas de ustedes"}, {"id": 324, "es": "Depende mucho de cada persona.", "en": "It depends a lot on each person.", "note": "", "sec": "Responder preguntas de ustedes"}, {"id": 325, "es": "En mi caso, me llevó bastante tiempo.", "en": "In my case, it took me quite a while.", "note": "llevar tiempo = to take time", "sec": "Responder preguntas de ustedes"}, {"id": 326, "es": "Otra pregunta que me hacen seguido es esta.", "en": "Another question I often get is this one.", "no fraid of making mistakes.", "note": "", "sec": "Consejos para aprender"}, {"id": 352, "es": "Hablar mal es parte del proceso.", "en": "Speaking badly is part of the process.", "note": "", "sec": "Consejos para aprender"}, {"id": 353, "es": "Un día van a ver que les sale solo.", "en": "One day you'll see it comes out on its own.", "note": "", "sec": "Consejos para aprender"}, {"id": 354, "es": "Busquen contenido que de verdad les guste.", "en": "Look for content you genuinely like.", "note": "", "sec": "Consejos para aprender"}, {"id": 355, "es": "Si se aburren, no van a seguir.", "en": "If you get bored, you won't keep going.", "note": "", "sec": "Consejos para aprender"}, {"id": 356, "es": "No estudien gramática todo el tiempo.", "en": "Don't study grammar all the time.", "note": "", "sec": "Consejos para aprender"}, {"id": 357, "es": "Escuchar es lo que más me sirvió a mí.", "en": "Listening is what helped me most.", "note": "", "sec": "Consejos para aprender"}, {"id": 358, "es": "Tengan paciencia con ustedes mismos.", "en": "Be patient with yourselves.", "note": "", "sec": "Consejos para aprender"}, {"id": 359, "es": "Van a llegar, de verdad.", "en": "You'll get there, really.", "note": "", "sec": "Consejos para aprender"}, {"id": 360, "es": "Confíen en el proceso.", "en": "Trust the process.", "note": "", "sec": "Consejos para aprender"}, {"id": 361, "es": "Tengo varias ideas dando vueltas.", "en": "I have several ideas floating around.", "note": "dar vueltas = to be floating around", "sec": "Planes y proyectos"}, {"id": 362, "es": "Estoy preparando algo nuevo para ustedes.", "en": "I'm preparing something new for you.", "note": "", "sec": "Planes y proyectos"}, {"id": 363, "es": "Todavía no lo puedo contar.", "en": "I can't tell you about it yet.", "note": "", "sec": "Planes y proyectos"}, {"id": 364, "es": "Si todo sale bien, lo subo la semana que viene.", "en": "If all goes well, I'll upload it next week.", "note": "", "sec": "Planes y proyectos"}, {"id": 365, "es": "Hace tiempo que lo tengo pensado.", "en": "I've been thinking about it for a while.", "note": "", "sec": "Planes y proyectos"}, {"id": 366, "es": "Quiero hacer una serie sobre este tema.", "en": "I want to make a series about this topic.", "note": "", "sec": "Planes y proyectos"}, {"id": 367, "es": "Me gustaría grabar en otros lugares.", "en": "I'd like to film in other places.", "note": "", "sec": "Planes y proyectos"}, {"id": 368, "es": "Estoy viendo cómo organizarlo.", "en": "I'm figuring out how to organise it.", "note": "", "sec": "Planes y proyectos"}, {"id": 369, "es": "Depende de cuánto tiempo tenga.", "en": "It depends on how much time I have.", "note": "", "sec": "Planes y proyectos"}, {"id": 370, "es": "Ojalá pueda hacerlo este año.", "en": "I hope I can do it this year.", "note": "", "sec": "Planes y proyectos"}, {"id": 371, "es": "Es un proyecto que me emociona mucho.", "en": "It's a project that really excites me.", "note": "", "sec": "Planes y proyectos"}, {"id": 372, "es": "Les voy contando cómo va.", "en": "I'll keep you posted on how it's going.", "note": "", "sec": "Planes y proyectos"}, {"id": 373, "es": "Si les interesa, díganme y lo hago.", "en": "If you're interested, tell me and I'll do it.", "note": "", "sec": "Planes y proyectos"}, {"id": 374, "es": "Estoy aprendiendo a hacerlo sobre la marcha.", "en": "I'm learning to do it as I go.", "note": "sobre la marcha = on the fly", "sec": "Planes y proyectos"}, {"id": 375, "es": "De a poco va tomando forma.", "en": "Little by little it's taking shape.", "note": "", "sec": "Planes y proyectos"}, {"id": 376, "es": "Me falta bastante todavía.", "en": "I still have a fair way to go.", "note": "", "sec": "Planes y proyectos"}, {"id": 377, "es": "Pero ya se viene, les prometo.", "en": "But it's coming, I promise.", "note": "ya se viene = it's on its way", "sec": "Planes y proyectos"}, {"id": 378, "es": "Gracias por la paciencia de siempre.", "en": "Thanks for your constant patience.", "note": "", "sec": "Planes y proyectos"}, {"id": 379, "es": "Esto lo hago gracias a ustedes.", "en": "I do this thanks to you.", "note": "", "sec": "Planes y proyectos"}, {"id": 380, "es": "Vamos a ver cómo sale.", "en": "Let's see how it comes out.", "note": "", "sec": "Planes y proyectos"}, {"id": 381, "es": "A ver... ¿cómo les explico esto?", "en": "Let's see... how do I explain this to you?", "note": "", "sec": "Pensar en voz alta"}, {"id": 382, "es": "Dejame pensar un segundo.", "en": "Let me think for a second.", "note": "", "sec": "Pensar en voz alta"}, {"id": 383, "es": "No sé bien cómo decirlo.", "en": "I'm not sure how to put it.", "note": "", "sec": "Pensar en voz alta"}, {"id": 384, "es": "Es difícil de explicar, pero lo intento.", "en": "It's hard to explain, but I'll try.", "note": "", "sec": "Pensar en voz alta"}, {"id": 385, "es": "¿Cómo era la palabra? Ya me va a salir.", "en": "What was the word? It'll come to me.", "note": "", "sec": "Pensar en voz alta"}, {"id": 386, "es": "Se me fue de la cabeza.", "en": "It went out of my head.", "note": "", "sec": "Pensar en voz alta"}, {"id": 387, "es": "Esperen que lo busco.", "en": "Hang on while I look it up.", "note": "", "sec": "Pensar en voz alta"}, {"id": 388, "es": "No me acuerdo del nombre exacto.", "en": "I don't remember the exact name.", "note": "", "sec": "Pensar en voz alta"}, {"id": 389, "es": "Capaz lo estoy diciendo mal.", "en": "Maybe I'm saying it wrong.", "note": "capaz = maybe, very RP", "sec": "Pensar en voz alta"}, {"id": 390, "es": "Corríjanme si me equivoco.", "en": "Correct me if I'm wrong.", "note": "", "sec": "Pensar en voz alta"}, {"id": 391, "es": "Creo que era así, no estoy segura.", "en": "I think it was like that, I'm not sure.", "note": "", "sec": "Pensar en voz alta"}, {"id": 392, "es": "Después lo chequeo y les aviso.", "en": "I'll check it afterwards and let you know.", "note": "", "sec": "Pensar en voz alta"}, {"id": 393, "es": "Me parece que me fui de tema otra vez.", "en": "I think I went off topic again.", "note": "", "sec": "Pensar en voz alta"}, {"id": 394, "es": "Bueno, no importa, sigamos.", "en": "Well, never mind, let's carry on.", "note": "", "sec": "Pensar en voz alta"}, {"id": 395, "es": "¿Por dónde iba? Ah, sí.", "en": "Where was I? Ah, yes.", "note": "", "sec": "Pensar en voz alta"}, {"id": 396, "es": "Esto ya se los había contado, ¿no?", "en": "I'd already told you this, right?", "note": "", "sec": "Pensar en voz alta"}, {"id": 397, "es": "Perdón, hablo mucho.", "en": "Sorry, I talk a lot.", "note": "", "sec": "Pensar en voz alta"}, {"id": 398, "es": "Es que me entusiasmo con el tema.", "en": "It's just that I get excited about the topic.", "note": "es que = it's just that", "sec": "Pensar en voz alta"}, {"id": 399, "es": "Bueno, ya está, me callo.", "en": "Right, that's it, I'll stop talking.", "note": "", "sec": "Pensar en voz alta"}, {"id": 400, "es": "Sigamos con lo nuestro.", "en": "Let's get back to what we were doing.", "note": "", "sec": "Pensar en voz alta"}, {"id": 401, "es": "El colectivo equivocado", "en": "The Wrong Bus", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 402, "es": "Era un martes a la mañana y yo estaba apurado.", "en": "It was a Tuesday morning and I was in a hurry.", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 403, "es": "Tenía que llegar al centro a las diez y ya eran casi las nueve y media.", "en": "I had to get downtown by ten and it was already almost half past nine.", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 404, "es": "Salí de casa corriendo, crucé la calle y me subí al primer colectivo que paró.", "en": "I ran out of the house, crossed the street and got on the first bus that stopped.", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 405, "es": "Pasé la SUBE, me senté al lado de la ventana y me puse a mirar el celular.", "en": "I tapped my SUBE card, sat by the window and started looking at my phone.", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 406, "es": "Iba tranquilo. Demasiado tranquilo.", "en": "I was relaxed. Too relaxed.", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 407, "es": "Después de unos veinte minutos levanté la cabeza y miré para afuera.", "en": "After about twenty minutes I looked up and glanced outside.", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 408, "es": "No reconocía nada.", "en": "I didn't recognise anything.", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 409, "es": "Las calles eran más angostas, había árboles por todos lados y la gente caminaba mucho más despacio.", "en": "The streets were narrower, there were trees everywhere and people were walking much more slowly.", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 410, "es": "Ahí me cayó la ficha: me había subido al colectivo equivocado.", "en": "That's when the penny dropped: I'd got on the wrong bus.", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 411, "es": "Me quise bajar enseguida, pero justo en ese momento empezó a llover fuerte.", "en": "I wanted to get off right away, but at that exact moment it started pouring.", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 412, "es": "Me bajé igual, sin paraguas, y me metí en el primer lugar que vi abierto.", "en": "I got off anyway, with no umbrella, and ducked into the first place I saw open.", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 413, "es": "Era un café chiquito, de esos antiguos, con mesas de madera y un mozo de unos setenta años.", "en": "It was a tiny café, one of those old ones, with wooden tables and a waiter of about seventy.", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 414, "es": "—Che, pibe, estás empapado —me dijo riéndose—. Sentate, que te traigo algo caliente.", "en": "\"Hey kid, you're soaked,\" he said, laughing. \"Sit down, I'll bring you something hot.\"", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 415, "es": "Me trajo un café con leche y dos medialunas que yo no había pedido.", "en": "He brought me a coffee with milk and two medialunas I hadn't ordered.", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 416, "es": "Le pregunté cuánto salía y me dijo que después arreglábamos.", "en": "I asked how much it was and he said we'd sort it out later.", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 417, "es": "Me quedé casi dos horas ahí. Perdí la reunión, obviamente.", "en": "I stayed there for almost two hours. I missed the meeting, obviously.", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 418, "es": "Pero el tipo me contó la historia del barrio, de cuando era chico, de cómo había cambiado todo.", "en": "But the guy told me the history of the neighbourhood, of when he was a kid, of how everything had changed.", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 419, "es": "Hablaba despacio y yo le entendía casi todo.", "en": "He spoke slowly and I understood almost everything.", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 420, "es": "Cuando paró de llover, me quiso cobrar solo el café.", "en": "When the rain stopped, he only wanted to charge me for the coffee.", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 421, "es": "Le dije que no, que me cobrara todo, y nos reímos un rato discutiendo por eso.", "en": "I said no, to charge me for everything, and we laughed for a while arguing about it.", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 422, "es": "Antes de irme me dijo una cosa que no me olvido más:", "en": "Before I left he said something I'll never forget:", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 423, "es": "—Che, no te apures tanto. Las mejores cosas te pasan cuando te equivocás de colectivo.", "en": "\"Hey, don't rush so much. The best things happen to you when you take the wrong bus.\"", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 424, "es": "Volví tres veces más ese mes.", "en": "I went back three more times that month.", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 425, "es": "Y hasta el día de hoy, cada vez que me equivoco de camino, me acuerdo de él.", "en": "And to this day, every time I take a wrong turn, I remember him.", "note": "", "sec": "Cuento · El colectivo equivocado"}, {"id": 426, "es": "¿Vos tenés hambre?", "en": "Are you hungry?", "note": "vos tenés — stress on the last syllable, no ie diphthong (tú tienes)", "sec": "Vos en presente · las formas básicas"}, {"id": 427, "es": "¿Vos podés venir mañana?", "en": "Can you come tomorrow?", "note": "poder → podés (not puedes)", "sec": "Vos en presente · las formas básicas"}, {"id": 428, "es": "¿Vos querés tomar algo?", "en": "Do you want to have a drink?", "note": "querer → querés (not quieres)", "sec": "Vos en presente · las formas básicas"}, {"id": 429, "es": "¿Vos sabés dónde queda?", "en": "Do you know where it is?", "note": "saber → sabés", "sec": "Vos en presente · las formas básicas"}, {"id": 430, "es": "¿Vos entendés lo que digo?", "en": "Do you understand what I'm saying?", "note": "entender → entendés", "sec": "Vos en presente · las formas básicas"}, {"id": 431, "es": "Vos pensás demasiado.", "en": "You think too much.", "note": "-ar verbs: pensás, hablás, trabajás", "sec": "Vos en presente · las formas básicas"}, {"id": 432, "es": "Vos hablás muy bien.", "en": "You speak really well.", "note": "", "sec": "Vos en presente · las formas básicas"}, {"id": 433, "es": "Vos vivís acá cerca, ¿no?", "en": "You live near here, right?", "note": "-ir verbs: vivís, salís, escribís", "sec": "Vos en presente · las formas básicas"}, {"id": 434, "es": "Vos siempre llegás tarde.", "en": "You always arrive late.", "note": "", "sec": "Vos en presente · las formas básicas"}, {"id": 435, "es": "¿Vos trabajás los sábados?", "en": "Do you work on Saturdays?", "note": "", "sec": "Vos en presente · las formas básicas"}, {"id": 436, "es": "Vos me entendés igual.", "en": "You understand me anyway.", "note": "", "sec": "Vos en presente · las formas básicas"}, {"id": 437, "es": "¿Vos comés carne?", "en": "Do you eat meat?", "note": "comer → comés", "sec": "Vos en presente · las formas básicas"}, {"id": 438, "es": "¿Vos te acordás de mí?", "en": "Do you remember me?", "note": "reflexive: te acordás, te levantás", "sec": "Vos en presente · las formas básicas"}, {"id": 439, "es": "Vos te preocupás por todo.", "en": "You worry about everything.", "note": "", "sec": "Vos en presente · las formas básicas"}, {"id": 440, "es": "¿Vos dormís bien?", "en": "Do you sleep well?", "note": "dormir → dormís (no ue diphthong)", "sec": "Vos en presente · las formas básicas"}, {"id": 441, "es": "Vos tenés razón.", "en": "You're right.", "note": "", "sec": "Vos en presente · las formas básicas"}, {"id": 442, "es": "¿Vos creés que sí?", "en": "Do you think so?", "note": "creer → creés", "sec": "Vos en presente · las formas básicas"}, {"id": 443, "es": "Vos sabés más que yo.", "en": "You know more than I do.", "note": "", "sec": "Vos en presente · las formas básicas"}, {"id": 444, "es": "¿Vos querés que te ayude?", "en": "Do you want me to help you?", "note": "", "sec": "Vos en presente · las formas básicas"}, {"id": 445, "es": "Vos hacés lo que querés.", "en": "You do whatever you want.", "note": "hacer → hacés", "sec": "Vos en presente · las formas básicas"}, {"id": 446, "es": "Vení un segundo.", "en": "Come here a second.", "note": "venir → vení: drop the -r, keep the stress", "sec": "El imperativo con vos"}, {"id": 447, "es": "Mirá esto.", "en": "Look at this.", "note": "mirar → mirá", "sec": "El imperativo con vos"}, {"id": 448, "es": "Decime la verdad.", "en": "Tell me the truth.", "note": "decir → decí (+ me)", "sec": "El imperativo con vos"}, {"id": 449, "es": "Hacé lo que te parezca.", "en": "Do whatever you think best.", "note": "hacer → hacé", "sec": "El imperativo con vos"}, {"id": 450, "es": "Poné la mesa, por favor.", "en": "Set the table, please.", "note": "poner → poné", "sec": "El imperativo con vos"}, {"id": 451, "es": "Salí de ahí.", "en": "Get out of there.", "note": "salir → salí", "sec": "El imperativo con vos"}, {"id": 452, "es": "Tomá, es para vos.", "en": "Here, it's for you.", "note": "tomar → tomá", "sec": "El imperativo con vos"}, {"id": 453, "es": "Escuchame bien.", "en": "Listen to me carefully.", "note": "the pronoun attaches: escuchame, contame", "sec": "El imperativo con vos"}, {"id": 454, "es": "Contame cómo te fue.", "en": "Tell me how it went.", "note": "", "sec": "El imperativo con vos"}, {"id": 455, "es": "Esperá un ratito.", "en": "Wait a little while.", "note": "esperar → esperá", "sec": "El imperativo con vos"}, {"id": 456, "es": "Pasá, está abierto.", "en": "Come in, it's open.", "note": "", "sec": "El imperativo con vos"}, {"id": 457, "es": "Dejá eso ahí.", "en": "Leave that there.", "note": "", "sec": "El imperativo con vos"}, {"id": 458, "es": "Andá tranquilo.", "en": "Go ahead, don't worry.", "note": "ir has an irregular vos imperative: andá (never \"í\")", "sec": "El imperativo con vos"}, {"id": 459, "es": "Sé paciente con vos mismo.", "en": "Be patient with yourself.", "note": "ser → sé (irregular)", "sec": "El imperativo con vos"}, {"id": 460, "es": "Fijate en el precio.", "en": "Check the price.", "note": "fijarse → fijate", "sec": "El imperativo con vos"}, {"id": 461, "es": "Acordate de llamarlo.", "en": "Remember to call him.", "note": "acordarse → acordate", "sec": "El imperativo con vos"}, {"id": 462, "es": "Vení que te muestro.", "en": "Come, I'll show you.", "note": "", "sec": "El imperativo con vos"}, {"id": 463, "es": "Probalo, está buenísimo.", "en": "Try it, it's delicious.", "note": "", "sec": "El imperativo con vos"}, {"id": 464, "es": "Avisame cuando llegues.", "en": "Let me know when you arrive.", "note": "", "sec": "El imperativo con vos"}, {"id": 465, "es": "Dale, animate.", "en": "Go on, give it a go.", "note": "animarse = to dare, to go for it", "sec": "El imperativo con vos"}, {"id": 466, "es": "No vengas tan tarde.", "en": "Don't come so late.", "note": "Negative commands switch to the tú subjunctive: no vengas, not \"no vengás\"", "sec": "El imperativo negativo"}, {"id": 467, "es": "No me digas eso.", "en": "Don't tell me that.", "note": "", "sec": "El imperativo negativo"}, {"id": 468, "es": "No te preocupes por eso.", "en": "Don't worry about that.", "note": "", "sec": "El imperativo negativo"}, {"id": 469, "es": "No hagas nada todavía.", "en": "Don't do anything yet.", "note": "", "sec": "El imperativo negativo"}, {"id": 470, "es": "No te vayas, quedate.", "en": "Don't go, stay.", "note": "one negative + one positive: vayas (tú), quedate (vos)", "sec": "El imperativo negativo"}, {"id": 471, "es": "No lo tomes a mal.", "en": "Don't take it the wrong way.", "note": "", "sec": "El imperativo negativo"}, {"id": 472, "es": "No te olvides de avisar.", "en": "Don't forget to let me know.", "note": "", "sec": "El imperativo negativo"}, {"id": 473, "es": "No seas tan duro con vos.", "en": "Don't be so hard on yourself.", "note": "con vos, never \"contigo\"", "sec": "El imperativo negativo"}, {"id": 474, "es": "No te apures.", "en": "Don't rush.", "note": "", "sec": "El imperativo negativo"}, {"id": 475, "es": "No me dejes esperando.", "en": "Don't leave me waiting.", "note": "", "sec": "El imperativo negativo"}, {"id": 476, "es": "No pongas eso ahí.", "en": "Don't put that there.", "note": "", "sec": "El imperativo negativo"}, {"id": 477, "es": "No salgas sin abrigo.", "en": "Don't go out without a coat.", "note": "", "sec": "El imperativo negativo"}, {"id": 478, "es": "No te metas en eso.", "en": "Don't get involved in that.", "note": "", "sec": "El imperativo negativo"}, {"id": 479, "es": "No pierdas tiempo con eso.", "en": "Don't waste time on that.", "note": "", "sec": "El imperativo negativo"}, {"id": 480, "es": "No te hagas problema.", "en": "Don't make a problem out of it.", "note": "", "sec": "El imperativo negativo"}, {"id": 481, "es": "No contestes todavía.", "en": "Don't answer yet.", "note": "", "sec": "El imperativo negativo"}, {"id": 482, "es": "No te enojes conmigo.", "en": "Don't get angry with me.", "note": "conmigo is normal; \"con vos\" only replaces contigo", "sec": "El imperativo negativo"}, {"id": 483, "es": "No digas nada por ahora.", "en": "Don't say anything for now.", "note": "", "sec": "El imperativo negativo"}, {"id": 484, "es": "No te vayas a olvidar.", "en": "Don't go and forget.", "note": "", "sec": "El imperativo negativo"}, {"id": 485, "es": "No me hagas esto.", "en": "Don't do this to me.", "note": "", "sec": "El imperativo negativo"}, {"id": 486, "es": "¿Y vos qué pensás?", "en": "And what do you think?", "note": "", "sec": "Preguntas con vos"}, {"id": 487, "es": "¿Vos cómo lo harías?", "en": "How would you do it?", "note": "", "sec": "Preguntas con vos"}, {"id": 488, "es": "¿Vos de dónde sos?", "en": "Where are you from?", "note": "ser → sos", "sec": "Preguntas con vos"}, {"id": 489, "es": "¿Vos a qué hora salís?", "en": "What time do you leave?", "note": "", "sec": "Preguntas con vos"}, {"id": 490, "es": "¿Vos con quién vas?", "en": "Who are you going with?", "note": "", "sec": "Preguntas con vos"}, {"id": 491, "es": "¿Vos qué me recomendás?", "en": "What do you recommend?", "note": "", "sec": "Preguntas con vos"}, {"id": 492, "es": "¿Vos cuánto hace que estás acá?", "en": "How long have you been here?", "note": "", "sec": "Preguntas con vos"}, {"id": 493, "es": "¿Vos ya probaste esto?", "en": "Have you tried this?", "note": "", "sec": "Preguntas con vos"}, {"id": 494, "es": "¿Vos te quedás o te vas?", "en": "Are you staying or going?", "note": "", "sec": "Preguntas con vos"}, {"id": 495, "es": "¿Vos qué hacés de tu vida?", "en": "What do you do with yourself?", "note": "a friendly \"what do you do\"", "sec": "Preguntas con vos"}, {"id": 496, "es": "¿Vos me estás cargando?", "en": "Are you pulling my leg?", "note": "", "sec": "Preguntas con vos"}, {"id": 497, "es": "¿Vos lo conocés?", "en": "Do you know him?", "note": "", "sec": "Preguntas con vos"}, {"id": 498, "es": "¿Vos venís o no?", "en": "Are you coming or not?", "note": "", "sec": "Preguntas con vos"}, {"id": 499, "es": "¿Vos sabías eso?", "en": "Did you know that?", "note": "", "sec": "Preguntas con vos"}, {"id": 500, "es": "¿Vos qué opinás del tema?", "en": "What's your take on it?", "note": "", "sec": "Preguntas con vos"}, {"id": 501, "es": "¿Vos también sentís lo mismo?", "en": "Do you feel the same way too?", "note": "", "sec": "Preguntas con vos"}, {"id": 502, "es": "¿Vos estarías dispuesto?", "en": "Would you be up for it?", "note": "", "sec": "Preguntas con vos"}, {"id": 503, "es": "¿Vos te animás?", "en": "Are you up for it?", "note": "", "sec": "Preguntas con vos"}, {"id": 504, "es": "¿Vos qué harías en mi lugar?", "en": "What would you do in my place?", "note": "", "sec": "Preguntas con vos"}, {"id": 505, "es": "¿Y vos? Contame.", "en": "And you? Tell me.", "note": "", "sec": "Preguntas con vos"}, {"id": 506, "es": "Esto es para vos.", "en": "This is for you.", "note": "para vos, never \"para ti\"", "sec": "Vos y los pronombres"}, {"id": 507, "es": "Voy con vos.", "en": "I'll go with you.", "note": "con vos, never \"contigo\"", "sec": "Vos y los pronombres"}, {"id": 508, "es": "A vos te queda bien.", "en": "It suits you.", "note": "a vos + te, doubled for emphasis", "sec": "Vos y los pronombres"}, {"id": 509, "es": "Te lo dejo a vos.", "en": "I'll leave it to you.", "note": "", "sec": "Vos y los pronombres"}, {"id": 510, "es": "Pensé en vos todo el día.", "en": "I thought about you all day.", "note": "en vos, not \"en ti\"", "sec": "Vos y los pronombres"}, {"id": 511, "es": "Según vos, ¿qué pasó?", "en": "According to you, what happened?", "note": "", "sec": "Vos y los pronombres"}, {"id": 512, "es": "Es tuyo, quedátelo.",         let displaySentences = [...rawSentences];
        let currentIdx = 0;
        let isAutoplayActive = false;
        let synth = window.speechSynthesis;

        function initVoices() {
            let voices = synth.getVoices();
            if (voices.length > 0) {
                const esVoice = voices.find(v => v.lang === 'es-AR') || voices.find(v => v.lang.startsWith('es'));
                const statusEl = document.getElementById('voiceStatus');
                if (esVoice) {
                    statusEl.innerText = `語音引擎：${esVoice.name} (${esVoice.lang})`;
                    statusEl.className = "text-xs bg-emerald-700 px-3 py-1 rounded-full font-normal";
                } else {
                    statusEl.innerText = "語音引擎已就緒 (使用系統預設西語)";
                    statusEl.className = "text-xs bg-emerald-700 px-3 py-1 rounded-full font-normal";
                }
            }
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = initVoices;
        }

        function renderList() {
            const container = document.getElementById('sentenceList');
            container.innerHTML = '';
            
            displaySentences.forEach((item, index) => {
                const card = document.createElement('div');
                card.id = `card-${index}`;
                card.className = `bg-white p-5 rounded-2xl shadow-sm border transition-all ${index === currentIdx ? 'border-sky-500 ring-2 ring-sky-100 bg-sky-50/20' : 'border-slate-100 hover:border-slate-200'}`;
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <div class="space-y-1.5">
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold text-sky-700 bg-sky-100/80 px-2.5 py-0.5 rounded-full">#${item.id}</span>
                                ${item.sec ? `<span class="text-xs font-medium text-slate-500">${item.sec}</span>` : ''}
                            </div>
                            <h2 class="text-xl font-bold text-slate-900 pt-0.5">${item.es}</h2>
                            <p class="text-slate-600 text-sm font-medium">${item.en}</p>
                            ${item.note ? `<div class="text-xs italic text-amber-800 bg-amber-50/80 border border-amber-200/50 p-2.5 rounded-xl mt-2">💡 註解：${item.note}</div>` : ''}
                        </div>
                        <button onclick="playSingle(${index})" class="bg-sky-600 hover:bg-sky-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow-sm transition shrink-0 flex items-center gap-1">
                            🔊 單句朗讀
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function scrollToCurrent() {
            const el = document.getElementById(`card-${currentIdx}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function playSingle(index) {
            unlockAudio();
            isAutoplayActive = false;
            currentIdx = index;
            renderList();
            scrollToCurrent();
            playCurrentSentence();
        }

        function startAutoplay() {
            unlockAudio();
            isAutoplayActive = true;
            renderList();
            scrollToCurrent();
            playCurrentSentence();
        }

            if (synth.paused) synth.resume();
            let u = new SpeechSynthesisUtterance("");
            synth.speak(u);
        }

        function playCurrentSentence() {
            synth.cancel();

            if (currentIdx >= displaySentences.length) return;

            const item = displaySentences[currentIdx];
            document.getElementById('currentPlayingText').innerText = `#${item.id} - ${item.es} (${item.en})`;

            const rate = parseFloat(document.getElementById('rateSelect').value);
            const isRepeatOne = document.getElementById('repeatOneCheck').checked;

            let voices = synth.getVoices();
            let esVoice = voices.find(v => v.lang === 'es-AR') || 
                          voices.find(v => v.lang.startsWith('es-419')) || 
                          voices.find(v => v.lang.startsWith('es')) || null;
            
            let enVoice = voices.find(v => v.lang === 'en-US') || 
                          voices.find(v => v.lang.startsWith('en')) || null;

            speakText(item.es, 'es-AR', esVoice, rate, () => {
                setTimeout(() => {
                    speakText(item.en, 'en-US', enVoice, rate, () => {
                        if (isRepeatOne) {
                            setTimeout(playCurrentSentence, 800);
                        } else if (isAutoplayActive) {
                            if (currentIdx < displaySentences.length - 1) {
                                currentIdx++;
                                renderList();
                                scrollToCurrent();
                                setTimeout(playCurrentSentence, 1000);
                            } else {
                                isAutoplayActive = false;
                                document.getElementById('currentPlayingText').innerText = "🎉 播放完畢！";
                            }
                        }
                    });
                }, 500);
            });
        }

        function speakText(text, langCode, voiceObj, rate, callback) {
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = langCode;
            if (voiceObj) utterance.voice = voiceObj;
            utterance.rate = rate;
            
            utterance.onend = () => { if (callback) callback(); };
            utterance.onerror = (e) => { 
                console.error("TTS Error:", e);
                if (callback) callback(); 
            };

            synth.speak(utterance);
        }

        function pauseAudio() {
            isAutoplayActive = false;
            synth.cancel();
            document.getElementById('currentPlayingText').innerText = "已暫停播放";
        }

        function stopAudio() {
            isAutoplayActive = false;
            currentIdx = 0;
            synth.cancel();
            renderList();
            document.getElementById('currentPlayingText').innerText = "已系統停止";
        }

        function nextSentence() {
            if (currentIdx < displaySentences.length - 1) {
                currentIdx++;
                renderList();
                scrollToCurrent();
                playCurrentSentence();
            }
        }

        function prevSentence() {
            if (currentIdx > 0) {
                currentIdx--;
                renderList();
                scrollToCurrent();
                playCurrentSentence();
            }
        }

        function filterSentences() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            displaySentences = rawSentences.filter(s => 
                s.es.toLowerCase().includes(q) || 
                s.en.toLowerCase().includes(q) || 
                s.note.toLowerCase().includes(q) ||
                s.sec.toLowerCase().includes(q)
            );
            currentIdx = 0;
            renderList();
        }

        window.onload = () => {
            renderList();
            initVoices();
        };
    </script>
</body>
</html>
